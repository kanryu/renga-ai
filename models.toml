# Model presets and their downloadable components.

[models."SDXL Illustrious"]
family = "SDXL"
pipeline = "checkpoint"
checkpoint.model = "Illustrious-XL-v2.0.safetensors"
checkpoint.url = "https://huggingface.co/OnomaAIResearch/Illustrious-XL-v2.0/resolve/main/Illustrious-XL-v2.0.safetensors?download=true"
params.autofit = "false"
params.diffusion_flash_attn = "false"
params.sample_method = "Euler"
params.sample_steps = "20"
params.cfg = "6.0"
params.scheduler = ""
params.eta = ""
params.flow_shift = ""

[models."Anima"]
family = "Anima"
pipeline = "separated"
diffusion.model = "anima-aesthetic-v1.1.safetensors"
diffusion.url = "https://huggingface.co/circlestone-labs/Anima/resolve/main/split_files/diffusion_models/anima-aesthetic-v1.1.safetensors?download=true"
vae.model = "qwen_image_vae.safetensors"
vae.url = "https://huggingface.co/circlestone-labs/Anima/resolve/main/split_files/vae/qwen_image_vae.safetensors?download=true"
text_encoder.model = "qwen_3_06b_base.safetensors"
text_encoder.url = "https://huggingface.co/circlestone-labs/Anima/resolve/main/split_files/text_encoders/qwen_3_06b_base.safetensors?download=true"
params.autofit = "true"
params.diffusion_flash_attn = "true"
params.backend = "diffusion=cuda0,te=cuda0,vae=cuda0"
params.sample_method = "Euler"
params.sample_steps = "20"
params.cfg = "6.0"
params.scheduler = ""
params.eta = ""
params.flow_shift = ""

[models."FLUX.2 Klein 4B"]
family = "FLUX.2"
pipeline = "separated"
diffusion.model = "flux-2-klein-4b-Q4_K_M.gguf"
